<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruan — Portfólio</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- 1. HERO (primary) -->
  <section id="inicio" class="section bg-primary">
    <div class="container">
      <p class="">Olá, eu sou o Ruan</p>
      <h1 class="mb-6 title">Hello World!</h1>
      <p class="fs-lg c-muted mw-prose mb-8">Deixa eu me apresentar: </p>
    </div>
  </section>

  <!-- 2. SOBRE (primary) -->
  <section id="sobre" class="section bg-primary">
    <div class="container">
      <h2 class="mb-6">Sobre</h2>
      <p class="fs-lg c-muted mw-prose">Quem você é, o que estuda, o que busca.</p>
    </div>
  </section>

  <!-- 3. PROJETOS (accent) -->
  <section id="projetos" class="section bg-accent">
    <div class="container">
      <h2 class="mb-8">Projetos</h2>
      <div class="grid grid-3 gap-6">
        <article class="card">
          <h3 class="mb-2">Projeto 1</h3>
          <p>Descrição.</p>
        </article>
        <article class="card">
          <h3 class="mb-2">Projeto 2</h3>
          <p>Descrição.</p>
        </article>
        <article class="card">
          <h3 class="mb-2">Projeto 3</h3>
          <p>Descrição.</p>
        </article>
      </div>
    </div>
  </section>

  <!-- 4. STACK (primary) -->
  <section id="stack" class="section bg-primary">
    <div class="container">
      <h2 class="mb-8">Stack</h2>
      <ul class="flex wrap gap-4">
        <li class="card">HTML</li>
        <li class="card">CSS</li>
        <li class="card">JavaScript</li>
      </ul>
    </div>
  </section>

  <!-- 5. CONTATO (aux) -->
  <section id="contato" class="section bg-aux">
    <div class="container">
      <h2 class="mb-4">Contato</h2>
      <p class="fs-lg c-muted mw-prose mb-8">Vamos conversar?</p>
      <a href="mailto:seuemail@exemplo.com" class="btn btn-accent">Enviar e-mail</a>
    </div>
  </section>

</body>
</html>
